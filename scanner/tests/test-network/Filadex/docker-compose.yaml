version: '3'

services:
  app:
    image: theluap/filadex:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://filadex:@db:5432/filadex"
      #DEFAULT_ADMIN_PASSWORD: "admin"
      LOG_LEVEL: "INFO"
      DEFAULT_LANGUAGE: "en"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "filadex"
      POSTGRES_DB: "filadex"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
