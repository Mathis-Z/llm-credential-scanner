version: "3"

services:
  app:
    image: theluap/filadex@sha256:4938007b2142ffe57b1a877b4dd42a5668654f75ece664f22643aa73b614bbdd
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://filadex:@db:5432/filadex"
      #DEFAULT_ADMIN_PASSWORD: "admin"
      LOG_LEVEL: "INFO"
      DEFAULT_LANGUAGE: "en"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: "filadex"
      POSTGRES_DB: "filadex"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    tmpfs:
      - /var/lib/postgresql/data
    restart: unless-stopped
