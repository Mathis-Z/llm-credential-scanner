version: "3.8"

services:
  huginn-db:
    image: mysql:5.7
    container_name: huginn-db
    environment:
      - MYSQL_ROOT_PASSWORD=huginn_root_password
      - MYSQL_DATABASE=huginn
      - MYSQL_USER=huginn
      - MYSQL_PASSWORD=huginn_password
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-phuginn_root_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  huginn:
    image: ghcr.io/huginn/huginn:latest
    container_name: huginn
    ports:
      - "3000:3000"
    environment:
      - DATABASE_ADAPTER=mysql2
      - DATABASE_HOST=huginn-db
      - DATABASE_PORT=3306
      - DATABASE_NAME=huginn
      - DATABASE_USERNAME=huginn
      - DATABASE_PASSWORD=huginn_password
      - SEED_USERNAME=admin
      - SEED_PASSWORD=password
      - SEED_EMAIL=admin@huginn.local
      - DEVISE_SECRET_KEY=huginn_devise_secret_key
    depends_on:
      huginn-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
