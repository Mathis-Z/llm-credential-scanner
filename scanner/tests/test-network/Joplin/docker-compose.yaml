version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: joplin
    tmpfs:
      - /var/lib/postgresql/data

  joplin:
    image: joplin/server:latest
    ports:
      - "22300:22300"
    environment:
      JOPLIN_IGNORE_CORS: "true"
      DB_CLIENT: pg
      POSTGRES_HOST: db
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: joplin
    depends_on:
      - db
