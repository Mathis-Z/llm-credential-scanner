# https://docs.4gaboards.com/docs/dev/install/docker-vars

services:
  db:
    image: postgres:16.14-alpine
    restart: always
    networks:
      - boards-network
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_DB: 4gaBoards
      POSTGRES_PASSWORD: notpassword
      POSTGRES_INITDB_ARGS: "-A scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 4gaBoards"]
      interval: 1s
      timeout: 5s
      retries: 50

  4gaBoards:
    image: ghcr.io/rargames/4gaboards:3.3.13
    restart: always
    networks:
      - boards-network
    tmpfs:
      - /app/public/user-avatars
      - /app/public/project-background-images
      - /app/private/attachments
    ports:
      - 3000:1337
    environment:
      BASE_URL: http://127.0.0.1:3000
      SECRET_KEY: notsecretkey
      DATABASE_URL: postgresql://postgres:notpassword@db/4gaBoards
      NODE_ENV: production
      ## Add optional 4ga Boards instance variables here
    depends_on:
      db:
        condition: service_healthy

networks:
  boards-network:
