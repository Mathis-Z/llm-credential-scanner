version: "3.8"

networks:
  zabbix-network:

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: zabbixdb
      POSTGRES_USER: zabbixdbuser
      POSTGRES_PASSWORD: C7GRpMXAdZR5pZi4gyqr
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - zabbix-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zabbixdbuser", "-d", "zabbixdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:6.4.6-ubuntu
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbixdb
      POSTGRES_USER: zabbixdbuser
      POSTGRES_PASSWORD: C7GRpMXAdZR5pZi4gyqr
      ZBX_CACHESIZE: 128M
    networks:
      - zabbix-network
    ports:
      - "10051:10051"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:6.4.6-ubuntu
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbixdb
      POSTGRES_USER: zabbixdbuser
      POSTGRES_PASSWORD: C7GRpMXAdZR5pZi4gyqr
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/New_York
    networks:
      - zabbix-network
    ports:
      - "80:8080"
      - "443:8443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy

  zabbix-agent:
    image: zabbix/zabbix-agent2:6.4.6-ubuntu
    environment:
      ZBX_HOSTNAME: zabbix-agent
      ZBX_SERVER_HOST: zabbix-server
    networks:
      - zabbix-network
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_healthy

  backups:
    image: postgres:15
    command: >
      sh -c 'sleep 30m &&
      while true; do
        pg_dump -h postgres -p 5432 -d zabbixdb -U zabbixdbuser | gzip > /srv/zabbix-postgres/backups/zabbix-postgres-backup-$(date "+%Y-%m-%d_%H-%M").gz &&
        find /srv/zabbix-postgres/backups -type f -mtime +7 | xargs rm -f &&
        sleep 24h;
      done'
    tmpfs:
      - /var/lib/postgresql/data
      - /srv/zabbix-postgres/backups
    environment:
      PGPASSWORD: C7GRpMXAdZR5pZi4gyqr
    networks:
      - zabbix-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
