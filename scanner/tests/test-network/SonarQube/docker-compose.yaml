version: "3.8"

services:
  sonarqube:
    image: sonarqube:26.7.0.124771-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    tmpfs:
      - /opt/sonarqube/data
      - /opt/sonarqube/logs
      - /opt/sonarqube/extensions
