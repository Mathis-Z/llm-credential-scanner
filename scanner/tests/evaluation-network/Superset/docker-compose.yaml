services:
  superset:
    image: apache/superset@sha256:fb3464528ec7076f91195f0ff7835755aa023e281f1bb78a84782ce7a36b3705
    container_name: eval-superset
    network_mode: bridge
    environment:
      - SUPERSET_SECRET_KEY=eval-superset-secret-key
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin
    command: >
      /bin/sh -c "superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"
    ports:
      - "18220:8088"
    restart: unless-stopped
