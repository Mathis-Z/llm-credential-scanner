services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "18147:9001"
      - "19100:9000"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data:
