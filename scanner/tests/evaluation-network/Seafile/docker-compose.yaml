services:
  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=asecret
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
      - MYSQL_DATABASE=seafile_db
      - MYSQL_USER=seafile
      - MYSQL_PASSWORD=asecret
    volumes:
      - seafile_db_data:/var/lib/mysql
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped

  seafile:
    image: seafileltd/seafile-mc:11.0-latest
    depends_on:
      - db
      - memcached
    environment:
      - DB_HOST=db
      - DB_ROOT_PASSWD=asecret
      - TIME_ZONE=UTC
      - SEAFILE_ADMIN_EMAIL=me@example.com
      - SEAFILE_ADMIN_PASSWORD=asecret
      - SEAFILE_SERVER_LETSENCRYPT=false
      - SEAFILE_SERVER_HOSTNAME=127.0.0.1:18169
    ports:
      - "18169:80"
    volumes:
      - seafile_data:/shared
    restart: unless-stopped

volumes:
  seafile_db_data:
  seafile_data:
