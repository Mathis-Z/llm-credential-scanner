services:
  db:
    image: mysql:8.0.46
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=casdoor
    restart: unless-stopped

  casdoor:
    image: casbin/casdoor:3.128.0
    depends_on:
      - db
    volumes:
      - ./app.conf:/conf/app.conf:ro
    ports:
      - "18159:8000"
    restart: unless-stopped
