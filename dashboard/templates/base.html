<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scanner Logs Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">SL</div>
                <div>
                    <h1>Scanner Logs</h1>
                    <p>Base: {{ base_dir }}</p>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <h2>Runs</h2>
                    <div class="sort-controls">
                        <button type="button" class="sort-button" data-sort="time" aria-label="Sort by time">Time</button>
                        <button type="button" class="sort-button" data-sort="alpha" aria-label="Sort alphabetically">A-Z</button>
                    </div>
                </div>
                <div class="run-list" id="runList">
                    {% for run in runs %}
                        <a class="run-item" href="{{ url_for('run_view', run_name=run.name) }}">
                            <div class="run-name">{{ run.name }}</div>
                            <div class="run-meta">
                                <span>{{ run.mtime_human }}</span>
                                {% if not run.db_exists %}
                                    <span class="pill warn">no db</span>
                                {% else %}
                                    <span class="pill ok">db ok</span>
                                {% endif %}
                            </div>
                        </a>
                    {% else %}
                        <div class="empty">No runs found yet.</div>
                    {% endfor %}
                </div>
            </div>
        </aside>
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
    const runsUrl = '{{ url_for("runs_poll") }}';
    const runList = document.getElementById('runList');
    const sortButtons = document.querySelectorAll('.sort-button');
    const sortKey = 'runSortMode';
    let currentSort = localStorage.getItem(sortKey) || 'time';

    function applySortState() {
        sortButtons.forEach((button) => {
            button.classList.toggle('is-active', button.dataset.sort === currentSort);
        });
    }

    function sortRuns(runs) {
        const sorted = [...runs];
        if (currentSort === 'alpha') {
            sorted.sort((a, b) => a.name.localeCompare(b.name));
        } else {
            sorted.sort((a, b) => b.mtime - a.mtime);
        }
        return sorted;
    }

    function renderRuns(runs) {
        if (!runList) {
            return;
        }
        if (!runs.length) {
            runList.innerHTML = '<div class="empty">No runs found yet.</div>';
            return;
        }

        const sortedRuns = sortRuns(runs);
        runList.innerHTML = sortedRuns.map((run) => {
            const badge = run.db_exists
                ? '<span class="pill ok">db ok</span>'
                : '<span class="pill warn">no db</span>';
            return `
                <a class="run-item" href="/run/${run.name}">
                    <div class="run-name">${run.name}</div>
                    <div class="run-meta">
                        <span>${run.mtime_human}</span>
                        ${badge}
                    </div>
                </a>
            `;
        }).join('');
    }

    async function pollRuns() {
        try {
            const response = await fetch(runsUrl, { cache: 'no-store' });
            if (!response.ok) {
                return;
            }
            const data = await response.json();
            renderRuns(data.runs || []);
        } catch (error) {
            return;
        }
    }

    sortButtons.forEach((button) => {
        button.addEventListener('click', () => {
            currentSort = button.dataset.sort || 'time';
            localStorage.setItem(sortKey, currentSort);
            applySortState();
            pollRuns();
        });
    });

    applySortState();

    setInterval(pollRuns, 8000);
    pollRuns();
    </script>
</body>
</html>
