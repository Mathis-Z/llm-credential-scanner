{% extends 'base.html' %}

{% block content %}
<section class="log-page">
    <div class="log-header">
        <div>
            <h2>{{ run_name }} · {{ log_name }} log</h2>
            <p>Full log view</p>
        </div>
        <button class="fullscreen-button" onclick="toggleFullscreen()">Fullscreen</button>
    </div>
    <pre id="logTarget" class="fullscreen-target">{{ log_content }}</pre>
</section>

<script>
const logTarget = document.getElementById('logTarget');

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        logTarget.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
}

function atBottom(element) {
    const threshold = 20;
    return (element.scrollHeight - element.scrollTop - element.clientHeight) < threshold;
}

async function pollFullLog() {
    try {
        const response = await fetch('{{ url_for("log_content", run_name=run_name, log_name=log_name) }}', {
            cache: 'no-store'
        });
        if (!response.ok) {
            return;
        }
        const text = await response.text();
        const keepBottom = atBottom(logTarget);
        logTarget.textContent = text;
        if (keepBottom) {
            logTarget.scrollTop = logTarget.scrollHeight;
        }
    } catch (error) {
        return;
    }
}

setInterval(pollFullLog, 1000);
pollFullLog();
</script>
{% endblock %}
